# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "vitals-on-fhir"
version = "0.1.0"
description = "Acquires vital signs from consumer wearables and exposes them as HL7 FHIR R4 resources."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "bleak>=0.22.3",
    "fhir-resources>=7.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
vitals-on-fhir = "vitals_on_fhir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitals_on_fhir"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.115.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bleak.*", "fhir.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["hardware: requires a physical BLE device (deselect with '-m not hardware')"]
addopts = "-m 'not hardware'"
testpaths = ["tests"]
