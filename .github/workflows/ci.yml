name: CI

# Run on pull requests only. A pull_request run checks the PR merged into
# main, which is the commit that merging creates, so a second run on the push
# to main after the merge repeated the same check. Triggering on every push
# also made each commit on a PR branch run twice.
on:
  pull_request:

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
