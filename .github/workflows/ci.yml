name: CI

# Run once per change: on pull requests, and on pushes to main (after a merge).
# Triggering on every push as well made each commit on a PR branch run twice
# (once for the push, once for the pull request).
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR (or to main) makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
